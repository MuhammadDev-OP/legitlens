name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build rules
        run: pnpm --filter @legitlens/rules build

      - name: Build web
        run: pnpm --filter @legitlens/web build

      - name: Build extension
        run: pnpm --filter @legitlens/extension build

      - name: Zip extension
        run: pnpm --filter @legitlens/extension zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: legitlens-extension
          path: apps/extension/.output/*.zip
