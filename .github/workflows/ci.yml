name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production deps (fail on high+)
        # Dev-only toolchain (WXT/firefox-profile/vitest) may still pull older
        # transitive packages; production runtime deps must stay clean.
        run: pnpm audit --prod --audit-level=high

      - name: Build rules
        run: pnpm --filter @legitlens/rules build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @legitlens/web build

      - name: Build extension
        run: pnpm --filter @legitlens/extension build

      - name: Zip extension
        run: pnpm --filter @legitlens/extension zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legitlens-extension
          path: apps/extension/.output/legitlensextension-*.zip
          if-no-files-found: error
          include-hidden-files: true
